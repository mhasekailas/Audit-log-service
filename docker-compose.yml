version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: audit_log_postgres
    environment:
      POSTGRES_DB: audit_log_db
      POSTGRES_USER: ${AUDIT_DB_USERNAME:?Set AUDIT_DB_USERNAME before starting Docker Compose}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD before starting Docker Compose}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
