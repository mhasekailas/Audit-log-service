spring.application.name=audit-log-service-test

# H2 in-memory DB for integration/security/concurrency tests
spring.datasource.url=jdbc:h2:mem:audittest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only credentials for the three audit API roles (never used outside the test profile)
AUDIT_READER_USERNAME=test-reader
AUDIT_READER_PASSWORD=reader-pass-123
AUDIT_API_USERNAME=test-writer
AUDIT_API_PASSWORD=writer-pass-123
AUDIT_ADMIN_USERNAME=test-admin
AUDIT_ADMIN_PASSWORD=admin-pass-123

# High limit so functional/scenario tests sharing one Spring context and credentials
# across many requests don't trip the limiter; RateLimitingFilter's own throttling
# logic is unit-tested in isolation (RateLimitingFilterTest).
audit.security.rate-limit.max-requests=10000
audit.security.rate-limit.window-seconds=60

# Tight limit so oversized-payload (413) behavior is exercisable in tests
audit.security.request.max-body-bytes=2048
