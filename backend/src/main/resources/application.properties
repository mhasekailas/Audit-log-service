spring.application.name=audit-log-service
spring.profiles.active=prod
spring.config.import=${SPRING_CONFIG_IMPORT:optional:file:./config/}

# PostgreSQL Configuration - read connection details from environment/config import only; never from source-controlled defaults
spring.datasource.url=${AUDIT_DB_URL}
spring.datasource.username=${AUDIT_DB_USERNAME}
spring.datasource.password=${AUDIT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway owns production schema changes; Hibernate only validates the migrated schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Logging
logging.level.root=INFO
logging.level.com.schwab=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Rate limiting (per client, sliding window) - mitigates brute force / replay abuse
audit.security.rate-limit.max-requests=60
audit.security.rate-limit.window-seconds=60

# CORS is deny-by-default. Set a comma-separated allowlist only for trusted UI origins,
# for example: https://audit.example.com,https://admin.example.com
audit.security.cors.allowed-origins=${AUDIT_CORS_ALLOWED_ORIGINS:}

# Require HTTPS for protected API requests in production. Direct TLS is controlled by
# server.ssl.* above; deployments behind a TLS-terminating proxy must forward
# X-Forwarded-Proto: https.
audit.security.require-https=${AUDIT_REQUIRE_HTTPS:true}

# Reject oversized request bodies before parsing/DB work (defense against payload abuse)
audit.security.request.max-body-bytes=1048576

# Break-glass Basic accounts are lifecycle-controlled through environment/config import.
# Set *_ENABLED=false to revoke immediately, or *_EXPIRES_AT to an ISO-8601 offset date-time
# such as 2026-08-19T23:59:00Z. Production deployments should prefer an external IdP/OIDC
# and keep these accounts narrowly scoped, rotated, and revocable.
AUDIT_READER_ENABLED=${AUDIT_READER_ENABLED:true}
AUDIT_READER_EXPIRES_AT=${AUDIT_READER_EXPIRES_AT:}
AUDIT_API_ENABLED=${AUDIT_API_ENABLED:true}
AUDIT_API_EXPIRES_AT=${AUDIT_API_EXPIRES_AT:}
AUDIT_ADMIN_ENABLED=${AUDIT_ADMIN_ENABLED:true}
AUDIT_ADMIN_EXPIRES_AT=${AUDIT_ADMIN_EXPIRES_AT:}

# Authentication providers. Basic auth is suitable only for local/break-glass use with
# lifecycle controls above. Production can enable OAuth2/OIDC JWT validation and disable
# Basic auth by setting audit.security.oauth2.enabled=true and audit.security.basic.enabled=false.
# When OIDC is enabled, provide spring.security.oauth2.resourceserver.jwt.issuer-uri
# via SPRING_CONFIG_IMPORT or environment-specific deployment configuration.
audit.security.basic.enabled=${AUDIT_BASIC_AUTH_ENABLED:true}
audit.security.oauth2.enabled=${AUDIT_OIDC_ENABLED:false}

