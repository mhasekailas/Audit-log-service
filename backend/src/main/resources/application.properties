spring.application.name=audit-log-service
spring.profiles.active=dev

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/audit_log_db
spring.datasource.username=${AUDIT_DB_USERNAME}
spring.datasource.password=${AUDIT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Logging
logging.level.root=INFO
logging.level.com.schwab=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Rate limiting (per client, sliding window) - mitigates brute force / replay abuse
audit.security.rate-limit.max-requests=60
audit.security.rate-limit.window-seconds=60

# Reject oversized request bodies before parsing/DB work (defense against payload abuse)
audit.security.request.max-body-bytes=1048576

